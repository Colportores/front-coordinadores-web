name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo el check que gatea el merge. Los builds de despliegue (Pages, artefacto con Supabase dev, producción) salen de
# staging.yml y production.yml.
jobs:
  check:
    name: lint + typecheck + tests + build (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Vacío en PRs de forks y mientras no se cargue (docs/ci-sonarqube.md): el paso de SonarQube se salta y el job pasa igual.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para atribuir líneas nuevas.
          fetch-depth: 0

      # La misma imagen que el desarrollo local (dockerfile.dev): el check corre adentro.
      - name: Construir imagen de desarrollo
        run: docker build -f dockerfile.dev -t panel-coordinadores-dev .

      # Build con el modo dev apagado, como staging y producción.
      # COVERAGE=1 hace que vitest escriba la cobertura (lcov) en coverage/, que sale del contenedor por el volumen.
      - name: Check (lint, typecheck, tests con cobertura, build)
        run: |
          mkdir -p coverage
          docker run --rm -e NEXT_PUBLIC_MODO_DEV=0 -e COVERAGE=1 -v "$PWD/coverage:/app/coverage" panel-coordinadores-dev npm run check

      # SonarQube Cloud (issue #147, docs/ci-sonarqube.md): solo informe, no frena el merge (continue-on-error y sin
      # esperar el quality gate). Se salta sin SONAR_TOKEN (forks) o sin la organización y la clave del proyecto.
      - name: SonarQube Cloud (cobertura de vitest)
        if: ${{ env.SONAR_TOKEN != '' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' && hashFiles('coverage/lcov.info') != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
