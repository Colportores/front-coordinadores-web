name: Staging

# Entorno de prueba del panel, en cada push a `staging` (merge de develop → staging). Reúsa los dos workflows que antes
# corrían en cada push a develop:
# - deploy-pages.yml: el sitio de prueba en GitHub Pages (export estático, datos simulados).
# - demo-supabase-dev.yml: el panel compilado con las variables de DEV (Supabase `ohdsavwpasfpapbyutrv`) como servidor
#   Node autónomo, subido como artefacto `panel-supabase-dev` (no se publica en ningún hosting).
#
# Para una demo sin pasar por staging: `gh workflow run staging.yml --ref develop` (o cada uno por separado:
# `gh workflow run demo-supabase-dev.yml --ref develop`, `gh workflow run deploy-pages.yml --ref develop`).

on:
  push:
    branches: [staging]
  # Corrida manual: solo sobre develop o staging (los workflows llamados lo verifican).
  workflow_dispatch:
  # Solo para que GitHub registre el workflow cuando un PR lo toca: `workflow_dispatch` exige que el archivo esté en la
  # rama por defecto (`production`) o que el workflow haya corrido alguna vez. En un PR no corre ningún job.
  pull_request:
    paths: [".github/workflows/staging.yml"]

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pages:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  demo-supabase-dev:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/demo-supabase-dev.yml
    permissions:
      contents: read
