# SonarQube Cloud (issue #147). Guía: docs/ci-sonarqube.md
#
# La organización y la clave del proyecto NO están acá: el CI las pasa desde las variables de Actions
# SONAR_ORGANIZATION y SONAR_PROJECT_KEY (-Dsonar.organization / -Dsonar.projectKey). El token (SONAR_TOKEN) es un
# secreto de Actions y nunca va en este archivo: el repo es público.
sonar.sourceEncoding=UTF-8

# Código y tests comparten carpeta: lo que calza con sonar.test.inclusions se indexa como test, el resto como código.
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs

# Cobertura de vitest (provider v8, reporter lcov): la genera `npm run check` en el CI con COVERAGE=1.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/coverage/**,public/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,src/test/**,src/**/*.d.ts,scripts/**
