# Entorno de desarrollo: todo corre acá adentro (install, dev server, lint,
# typecheck, tests, build y QA con Playwright).
#
#   docker compose -f compose.dev.yml up                     # dev server en http://localhost:3000
#   docker compose -f compose.dev.yml run --rm app npm run check
#   docker compose -f compose.dev.yml run --rm app npm install <paquete>
services:
  app:
    build:
      context: .
      dockerfile: dockerfile.dev
    # Una imagen por repo, la misma con cualquier `-p`: no se reconstruye salvo que cambie dockerfile.dev.
    image: front-coordinadores-web-dev:latest
    # Tope de RAM del contenedor (informe del 21/10: ~1,3 GB normal, ~2 GB con la build de Next
    # y Playwright). Con memswap_limit = 3g, el swap permitido es de 0,5 GB: si se pasa, Docker
    # mata este contenedor y no deja a la VM entera sin memoria.
    mem_limit: 2500m
    memswap_limit: 3g
    ports:
      - "3000:3000"
    environment:
      # Modo dev: chips de estado de cada HU y pestañas Stock/Cuentas visibles.
      # En staging y producción no se define (queda apagado).
      NEXT_PUBLIC_MODO_DEV: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Heap de Node acotado (1,5 GB) para la build y los checks dentro del contenedor: así el
      # recolector de basura trabaja antes de llegar al tope de `mem_limit`. Solo vale acá: ni el
      # CI ni staging ni producción usan este compose, y `package.json` no lo fija.
      NODE_OPTIONS: "--max-old-space-size=1536"
      # El bind mount desde Windows/macOS no propaga eventos de archivos:
      # Turbopack sondea cada N ms (next.config.ts → watchOptions.pollIntervalMs).
      NEXT_WATCH_POLL_MS: "1000"
    volumes:
      - .:/app
      # node_modules y .next viven en volúmenes de Docker, no en el host.
      # Docker copia node_modules de la imagen solo al crear el volumen: después
      # de cambiar dependencias, `docker compose -f compose.dev.yml down -v` y
      # `docker compose -f compose.dev.yml build` (ver README).
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
